[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core"
version = "0.1.0"
description = "Shared, approval-gated runtime for Bowser Technologies specialist AIs"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["forge_core*"]
